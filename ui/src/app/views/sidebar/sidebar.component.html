<div class="sidebar">

        <h6>Quality of Life Index Filter</h6>

            type="button"
            class="btn-close"
            aria-label="Close"
            (click)="onCloseSidebar($event)"

    <qoli-filter [onToggleScore]="onToggleScore"></qoli-filter>
</div>
